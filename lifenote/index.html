<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff6f0">
  <title>라이프노트 | LifeNote — 영상 속 꿀템 아카이브</title>
  <meta name="description" content="몰라도 살지만, 알면 삶의 질이 달라지는 꿀팁 아카이브. 라이프노트 영상에 소개된 제품을 번호별로 모아 보고 바로 확인하세요.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://myreelsmap.com/lifenote/">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="라이프노트 | LifeNote">
  <meta property="og:title" content="라이프노트 | LifeNote — 영상 속 꿀템 아카이브">
  <meta property="og:description" content="영상 속 꿀템을 번호별로 한 번에. 번호나 상품명으로 바로 찾아보세요.">
  <meta property="og:url" content="https://myreelsmap.com/lifenote/">
  <meta property="og:image" content="https://myreelsmap.com/lifenote/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="라이프노트 | LifeNote — 영상 속 꿀템 아카이브">
  <meta name="twitter:description" content="영상 속 꿀템을 번호별로 한 번에. 번호나 상품명으로 바로 찾아보세요.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <style>
    :root{
      --bg:#fff9f5;
      --bg-deep:#fdeee6;
      --card:#ffffff;
      --ink:#332825;
      --ink-soft:#5f514c;
      --muted:#9b8d86;
      --line:#f3e5dd;
      --rose:#dd8a74;
      --rose-deep:#c4705a;
      --rose-soft:#fdeee8;
      --butter:#fdf1dc;
      --mint:#eaf4ef;
      --shadow:0 10px 28px rgba(120,80,60,.08);
      --shadow-lift:0 16px 38px rgba(120,80,60,.14);
      --radius:20px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(120% 60% at 50% -10%, #ffe9dd 0%, rgba(255,233,221,0) 62%),
        linear-gradient(180deg,#fff8f3 0%, #fff9f5 40%, #fffaf7 100%);
      background-attachment:fixed;
      font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
      line-height:1.5;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .shell{max-width:640px;margin:0 auto;padding:0 18px 44px}

    /* ---------- header ---------- */
    .hero{text-align:center;padding:34px 0 22px}
    .logo-ring{
      width:104px;height:104px;margin:0 auto 14px;border-radius:50%;
      background:linear-gradient(145deg,#fff,#ffe9dd);
      box-shadow:0 12px 26px rgba(190,120,95,.18), inset 0 0 0 1px #fff;
      display:grid;place-items:center;overflow:hidden;
    }
    .logo-ring img{width:100%;height:100%;object-fit:cover;display:block}
    .hero h1{
      margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px;color:#3a2c27;
    }
    .hero .handle{display:block;margin-top:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
    .tagline{
      margin:10px auto 0;max-width:20em;font-size:14px;line-height:1.62;color:#6c5b54;
      word-break:keep-all;
    }
    .yt-btn{
      display:inline-flex;align-items:center;gap:8px;margin-top:18px;
      height:44px;padding:0 20px;border-radius:999px;
      background:#fff;color:#4a3b35;text-decoration:none;
      font-size:13.5px;font-weight:700;
      border:1px solid #f2ddd3;box-shadow:0 6px 16px rgba(150,100,80,.10);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .yt-btn:active{transform:scale(.97)}
    .yt-btn .yt-icon{width:22px;height:22px;border-radius:7px;background:#ff3d2e;display:grid;place-items:center;flex:0 0 auto}
    .yt-btn .yt-icon svg{width:11px;height:11px;fill:#fff;display:block}

    /* ---------- controls ---------- */
    .controls{position:sticky;top:0;z-index:20;margin:6px -18px 0;padding:12px 18px 10px;
      background:linear-gradient(180deg,rgba(255,249,245,.96) 62%,rgba(255,249,245,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .search{position:relative}
    .search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55;pointer-events:none}
    .search input{
      width:100%;height:50px;border:1px solid #f0ded4;border-radius:16px;
      background:#fff;padding:0 44px 0 44px;
      font-size:15px;color:var(--ink);outline:none;
      box-shadow:0 4px 14px rgba(150,105,85,.07);
      transition:border-color .18s ease, box-shadow .18s ease;
      appearance:none;
    }
    .search input::placeholder{color:#b6a8a1;font-size:13.5px}
    .search input:focus{border-color:#eab8a6;box-shadow:0 0 0 4px rgba(221,138,116,.14)}
    .search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
    .search .clear{
      position:absolute;right:10px;top:50%;transform:translateY(-50%);
      width:28px;height:28px;border:0;border-radius:50%;background:#f6ece6;color:#9c8b83;
      font-size:13px;line-height:1;display:none;place-items:center;cursor:pointer
    }
    .search .clear.show{display:grid}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{
      flex:0 0 auto;height:36px;padding:0 15px;border-radius:999px;
      border:1px solid #f0ded4;background:#fff;color:#8b7a72;
      font-size:13px;font-weight:700;letter-spacing:-.2px;cursor:pointer;
      transition:all .18s ease;white-space:nowrap
    }
    .chip:active{transform:scale(.96)}
    .chip[aria-pressed="true"]{background:#3a2c27;border-color:#3a2c27;color:#fff;box-shadow:0 6px 14px rgba(58,44,39,.18)}

    /* ---------- list ---------- */
    .meta-row{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 12px}
    .meta-row .count{font-size:12.5px;font-weight:700;color:var(--muted)}
    .meta-row .count b{color:var(--rose-deep)}
    .meta-row .sort{font-size:11.5px;font-weight:600;color:#b3a59e}
    .list{display:grid;gap:16px}

    .card{
      position:relative;background:var(--card);border-radius:var(--radius);
      border:1px solid #f6e9e2;box-shadow:var(--shadow);
      overflow:hidden;
      animation:rise .34s cubic-bezier(.22,.9,.3,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .card-top{display:flex;gap:14px;padding:18px 18px 0}
    .thumb{
      flex:0 0 auto;width:66px;height:66px;border-radius:18px;
      display:grid;place-items:center;font-size:30px;
      background:linear-gradient(160deg,#fff3ec,#fbe3d8);
      box-shadow:inset 0 0 0 1px #fff, 0 6px 14px rgba(200,140,115,.12);
      overflow:hidden;
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .card-head{min-width:0;flex:1 1 auto;padding-top:2px}
    .badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
    .no{
      display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:8px;
      background:#3a2c27;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.4px;
      font-variant-numeric:tabular-nums
    }
    .cat{
      display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;
      background:var(--mint);color:#4f7a66;font-size:11px;font-weight:700
    }
    .card h2{
      margin:8px 0 0;font-size:15.5px;font-weight:800;line-height:1.42;
      letter-spacing:-.35px;color:#332825;word-break:keep-all;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
    }
    .summary{
      margin:12px 18px 0;padding:13px 14px;border-radius:14px;
      background:linear-gradient(135deg,#fff7f1,#fdf0e7);
      color:#6a544b;font-size:13px;line-height:1.55;font-weight:600;
      word-break:keep-all;letter-spacing:-.1px
    }
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 18px 0}
    .tag{font-size:11.5px;font-weight:600;color:#b08d7f;background:#fdf5f1;border:1px solid #f6e8e1;border-radius:999px;padding:3px 9px}
    .actions{display:grid;gap:8px;padding:16px 18px 18px}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:7px;
      min-height:46px;border-radius:14px;text-decoration:none;
      font-size:14px;font-weight:800;letter-spacing:-.3px;
      transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .btn:active{transform:scale(.985)}
    .btn-buy{
      background:linear-gradient(135deg,#e0907a,#d4775f);color:#fff;
      box-shadow:0 8px 18px rgba(212,119,95,.28);
    }
    .btn-buy .arrow{font-size:12px;opacity:.9}
    .btn-video{
      background:#fff8f4;color:#8a6a5d;border:1px solid #f4e2d8;
    }
    .btn-video .play{width:18px;height:18px;border-radius:50%;background:#ff3d2e;display:grid;place-items:center}
    .btn-video .play svg{width:8px;height:8px;fill:#fff}

    .empty{
      text-align:center;padding:48px 20px;color:#a1938c;font-size:13.5px;line-height:1.7;
      background:#fff;border-radius:var(--radius);border:1px dashed #f0ded4
    }
    .empty .big{display:block;font-size:30px;margin-bottom:8px}

    .foot{margin-top:26px;text-align:center}
    .foot .contact{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9b8d86;text-decoration:none;margin-bottom:14px}
    .notice{
      margin:0 auto;max-width:34em;padding:14px 16px;border-radius:14px;
      background:#fff;border:1px solid #f6e9e2;
      font-size:11px;line-height:1.7;color:#a89a93;word-break:keep-all
    }
    .notice b{color:#8d7a71;font-weight:700}
    .copyright{margin-top:14px;font-size:10.5px;color:#c0b3ac;letter-spacing:.2px}

    .skeleton{height:210px;border-radius:var(--radius);background:#fff;border:1px solid #f6e9e2}

    @media (min-width:560px){
      .hero{padding-top:44px}
      .logo-ring{width:116px;height:116px}
      .hero h1{font-size:25px}
      .tagline{font-size:14.5px}
      .actions{grid-template-columns:1fr 1fr}
      .btn-video{order:2}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
<div class="shell">

  <header class="hero">
    <div class="logo-ring">
      <img src="logo.png" alt="라이프노트 로고" width="104" height="104">
    </div>
    <h1>라이프노트 | LifeNote</h1>
    <span class="handle">@lifenotekr</span>
    <p class="tagline">몰라도 살지만, 알면 삶의 질이 달라지는 꿀팁 아카이브 📓</p>
    <a class="yt-btn" href="https://www.youtube.com/@lifenotekr" target="_blank" rel="noopener noreferrer">
      <span class="yt-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      유튜브 채널 바로가기
    </a>
  </header>

  <section class="controls" aria-label="검색 및 카테고리 필터">
    <div class="search">
      <span class="ico" aria-hidden="true">🔍</span>
      <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
             placeholder="번호 또는 상품명으로 검색 (예: 1, 샤워호스)" aria-label="번호 또는 상품명 검색">
      <button class="clear" id="clear" type="button" aria-label="검색어 지우기">✕</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="카테고리"></div>
  </section>

  <div class="meta-row">
    <span class="count" id="count" aria-live="polite"></span>
    <span class="sort">번호순 ↑</span>
  </div>

  <main class="list" id="list"></main>
  <div class="empty" id="empty" hidden>
    <span class="big">🫧</span>
    찾는 꿀템이 없어요.<br>다른 번호나 상품명으로 검색해 보세요.
  </div>

  <footer class="foot">
    <a class="contact" href="mailto:notedailey100@gmail.com">✉️ notedailey100@gmail.com</a>
    <p class="notice">
      <b>본 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</b><br>
      상품 가격 및 재고는 쿠팡 사정에 따라 변동될 수 있습니다.
    </p>
    <div class="copyright">© 2026 라이프노트 | LifeNote</div>
  </footer>

</div>

<script>
/* ============================================================
   꿀템 데이터 — 새 상품은 아래 배열에 객체 하나만 추가하면 끝!
   { no:"02", category:"주방", emoji:"🍳", title:"...", summary:"...",
     tags:["#태그"], buyUrl:"https://link.coupang.com/...",
     videoUrl:"https://youtube.com/shorts/...", image:"(선택) 이미지 경로" }
   ============================================================ */
const ITEMS = [
  {
    no: "01",
    category: "욕실/청소",
    emoji: "🚿",
    title: "대림바스 디클린 물때방지 실리콘 샤워호스 2m",
    summary: "쇠줄 틈새 까만 물때 탈출! 공구 없이 30초면 손으로 교체 끝 ✨",
    tags: ["#물때방지", "#로켓배송", "#욕실청소", "#꿀템"],
    buyUrl: "https://link.coupang.com/a/itF9FErlV6",
    videoUrl: "https://youtube.com/shorts/b_5KwSSxJOM"
  }
];

const CATEGORIES = ["전체", "욕실/청소", "주방", "생활/리빙"];

const listEl  = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const qEl     = document.getElementById("q");
const clearEl = document.getElementById("clear");
const countEl = document.getElementById("count");
const chipsEl = document.getElementById("chips");

let activeCat = "전체";

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));

/* 카테고리 칩 렌더 */
CATEGORIES.forEach((cat, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.textContent = cat;
  b.dataset.cat = cat;
  b.setAttribute("aria-pressed", String(i === 0));
  b.addEventListener("click", () => {
    activeCat = cat;
    [...chipsEl.children].forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.cat === cat)));
    render();
  });
  chipsEl.appendChild(b);
});

/* 검색어 정규화 */
function normalize(v) {
  return String(v).toLowerCase()
    .replace(/[\[\]]/g, "")
    .replace(/(\d+)\s*번/g, "$1")
    .replace(/#/g, "")
    .replace(/\s+/g, "")
    .trim();
}

function matchesQuery(item, raw) {
  const q = normalize(raw);
  if (!q) return true;
  const no = String(item.no).replace(/\D/g, "");
  // 번호 검색: "1" → 01, "01" → 01, "10" → 10
  if (/^\d+$/.test(q)) {
    if (no === String(Number(q)) || no === q.padStart(no.length, "0")) return true;
  }
  const hay = normalize([item.title, item.summary, item.category, (item.tags || []).join(" ")].join(" "));
  return hay.includes(q);
}

function card(item, index) {
  const el = document.createElement("article");
  el.className = "card";
  el.id = "item-" + esc(item.no);
  el.style.animationDelay = Math.min(index * 40, 200) + "ms";

  const thumb = item.image
    ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">`
    : esc(item.emoji || "📦");

  const tags = (item.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("");

  el.innerHTML = `
    <div class="card-top">
      <div class="thumb" aria-hidden="true">${thumb}</div>
      <div class="card-head">
        <div class="badges">
          <span class="no">[${esc(item.no)}번]</span>
          <span class="cat">${esc(item.category)}</span>
        </div>
        <h2>${esc(item.title)}</h2>
      </div>
    </div>
    <p class="summary">${esc(item.summary)}</p>
    ${tags ? `<div class="tags">${tags}</div>` : ""}
    <div class="actions">
      <a class="btn btn-buy" href="${esc(item.buyUrl)}" target="_blank" rel="noopener noreferrer sponsored">
        쿠팡 최저가 확인 <span class="arrow">↗</span>
      </a>
      <a class="btn btn-video" href="${esc(item.videoUrl)}" target="_blank" rel="noopener noreferrer">
        <span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
        관련 쇼츠 영상 보기 🎬
      </a>
    </div>`;
  return el;
}

function render() {
  const q = qEl.value;
  const shown = ITEMS.filter((it) =>
    (activeCat === "전체" || it.category === activeCat) && matchesQuery(it, q)
  );

  listEl.replaceChildren();
  shown.forEach((it, i) => listEl.appendChild(card(it, i)));

  emptyEl.hidden = shown.length > 0;
  listEl.hidden = shown.length === 0;

  const total = ITEMS.length;
  countEl.innerHTML = (q.trim() || activeCat !== "전체")
    ? `검색 결과 <b>${shown.length}</b>개 / 전체 ${total}개`
    : `등록된 꿀템 <b>${total}</b>개`;
  clearEl.classList.toggle("show", !!q);
}

qEl.addEventListener("input", render);
qEl.addEventListener("search", render);
qEl.addEventListener("keydown", (e) => { if (e.key === "Escape") { qEl.value = ""; render(); qEl.blur(); } });
clearEl.addEventListener("click", () => { qEl.value = ""; render(); qEl.focus(); });

render();
</script>
</body>
</html>

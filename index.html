<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>릴스맛집지도</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#202124}header{padding:12px 16px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center}b{font-weight:900}.logo{font-size:18px}.logo i{font-style:normal;background:#ff4d2e;color:#fff;padding:9px;border-radius:12px;margin-right:8px}input{flex:1;max-width:650px;margin-left:auto;padding:12px;border:1px solid #ddd;border-radius:13px;background:#f7f6f4}button{border:0;border-radius:11px;padding:11px 13px;font-weight:800}.dark{background:#202124;color:#fff}main{height:calc(100vh - 63px);display:grid;grid-template-columns:420px 1fr}.side{padding:18px;overflow:auto;border-right:1px solid #eee}.hero{padding:21px;border:1px solid #ffe0d7;border-radius:22px;background:linear-gradient(135deg,#fff1ec,#fff)}.hero small{color:#ff4d2e;font-weight:900}.hero h1{font-size:27px;line-height:1.2;margin:9px 0}.hero p,.muted{color:#777;font-size:12px}.filters{display:flex;gap:6px;overflow:auto;padding:14px 0}.chip{white-space:nowrap;border:1px solid #e5e5e5;background:#fff;border-radius:99px;padding:8px 10px;font-size:12px}.chip.on{background:#ff4d2e;color:#fff}.head{display:flex;justify-content:space-between;margin:6px 0 10px}.cards{display:grid;gap:9px}.card{border:1px solid #e8e8e8;border-radius:16px;padding:12px}.addr{font-size:11px;color:#777;margin:5px 0}.stats{font-size:11px;color:#777;display:flex;gap:9px}.badge{display:inline-block;background:#fff0eb;color:#ad3a26;border-radius:7px;padding:4px 6px;font-size:10px;margin:6px 4px 7px 0}.card a{font-size:11px;color:#ad3a26}.empty{border:1px dashed #ddd;border-radius:14px;padding:25px;text-align:center;color:#777;font-size:12px}#map{height:100%}.drawer{position:fixed;z-index:2000;right:0;top:0;height:100%;width:min(520px,100%);background:#fff;box-shadow:-15px 0 60px #0003;padding:17px;overflow:auto;transform:translateX(103%);transition:.2s}.drawer.show{transform:none}.dhead{display:flex;justify-content:space-between}.item{border:1px solid #eee;border-radius:13px;padding:10px;margin-top:8px}.item small{display:block;color:#777;margin-top:4px}.pin{width:32px;height:32px;background:#ff4d2e;border:3px solid white;border-radius:12px 12px 12px 4px;transform:rotate(-45deg);display:grid;place-items:center}.pin span{transform:rotate(45deg)}
@media(max-width:850px){header{flex-wrap:wrap}input{order:3;width:100%;max-width:none}main{height:auto;grid-template-columns:1fr;grid-template-rows:auto 58vh}.side{border:0}.hero h1{font-size:24px}#map{min-height:58vh}}</style></head><body>
<header><div class="logo"><i>🍜</i><b>릴스맛집지도</b></div><input id="q" placeholder="가게명, 주소 검색"><button class="dark" onclick="drawer.classList.add('show')">수집함</button></header>
<main><section class="side"><div class="hero"><small>📍 서울 맛집 베타</small><h1>인스타에서 발견한 맛집을<br>지도에서 한눈에</h1><p>‘맛집지도 저장’으로 모은 릴스를 자동 분석해 실제 맛집 후보와 위치를 정리합니다.</p></div><div class="filters" id="filters"></div><div class="head"><b>릴스 맛집 <span id="count" class="muted"></span></b><span id="sync" class="muted">불러오는 중…</span></div><div id="cards" class="cards"></div></section><section id="map"></section></main>
<aside id="drawer" class="drawer"><div class="dhead"><div><b>📥 자동 수집함</b><div class="muted">인스타 → Apify → Supabase</div></div><button onclick="drawer.classList.remove('show')">✕</button></div><div id="inbox"></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API="https://tbyfoxsyadmpeeatyzvm.supabase.co/functions/v1/site-data";let rs=[],ib=[],active="전체";const cats=["전체","식사","일식","양식","카페·디저트","술집"],map=L.map("map").setView([37.5665,126.978],11),layer=L.layerGroup().addTo(map);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),F=n=>Number(n||0).toLocaleString();function icon(){return L.divIcon({className:"",html:'<div class="pin"><span>🍽️</span></div>',iconSize:[32,32],iconAnchor:[16,30]})}
function render(){filters.innerHTML=cats.map(c=>`<button class="chip ${c===active?"on":""}" onclick="active='${c}';render()">${c}</button>`).join("");let t=q.value.toLowerCase(),a=rs.filter(x=>(active==="전체"||x.category===active||(!x.category&&active==="식사"))&&(!t||[x.name,x.address,x.region].join(" ").toLowerCase().includes(t)));count.textContent=a.length+"곳";cards.innerHTML=a.length?a.map(x=>`<div class="card"><b>${E(x.name)}</b><div class="addr">📍 ${E(x.address||"주소 확인중")}</div><span class="badge">${E(x.category||"식사")}</span><span class="badge">${E(x.region||"서울")}</span><div class="stats"><span>▶ ${F(x.view_count)}</span><span>♥ ${F(x.like_count)}</span><span>💬 ${F(x.comment_count)}</span></div>${x.instagram_url?`<a target="_blank" href="${E(x.instagram_url)}">원본 인스타 ↗</a>`:""}</div>`).join(""):'<div class="empty">아직 지도에 표시할 검증된 맛집이 없습니다.</div>';layer.clearLayers();a.forEach(x=>{let a=+x.latitude,b=+x.longitude;if(Number.isFinite(a)&&Number.isFinite(b))L.marker([a,b],{icon:icon()}).addTo(layer).bindPopup(`<b>${E(x.name)}</b><br>${E(x.address||"")}`)})}
function inboxRender(){inbox.innerHTML=ib.map(x=>`<div class="item"><b>${E(x.restaurant_name||"가게명 확인중")}</b><small>${E(x.address||"주소 확인중")}<br>▶ ${F(x.view_count)} · ♥ ${F(x.like_count)} · 💬 ${F(x.comment_count)}<br>${E(x.analysis_status||x.status)}</small></div>`).join("")||'<div class="empty">수집 데이터 없음</div>'}
async function load(){try{let r=await fetch(API+"?t="+Date.now()),j=await r.json();if(!j.ok)throw 0;rs=j.restaurants||[];ib=j.inbox||[];sync.textContent="Supabase 자동연동";render();inboxRender()}catch(e){sync.textContent="연동 오류"}}q.addEventListener("input",render);render();load();setInterval(load,60000);
</script></body></html>

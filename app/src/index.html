    $("mapCategoryFilter").addEventListener("click",event=>{const reel=event.target.closest("[data-reel-filter]");if(reel){activeReelFilter=activeReelFilter===reel.dataset.reelFilter?"":reel.dataset.reelFilter;closePlaceSheet();applyFilters(true);return}const button=event.target.closest("[data-map-category]");if(!button)return;mapCategory=button.dataset.mapCategory;activeCategory=mapCategory;closePlaceSheet();applyFilters(true);$("mapCategoryFilter").querySelector('[data-map-category][aria-pressed="true"]')?.scrollIntoView({block:"nearest",inline:"nearest"});});
    $("cards").addEventListener("click",e=>{const retry=e.target.closest("[data-retry-load]");if(retry){loadingError=false;applyFilters();load();return}const mapButton=e.target.closest("[data-saved-map]");if(mapButton){selectRestaurant(mapButton.dataset.savedMap);return}const save=e.target.closest("[data-save]"),share=e.target.closest("[data-share]");if(save){e.stopPropagation();toggleSave(save.dataset.save);return}if(share){e.stopPropagation();shareRestaurant(share.dataset.share);return}if(e.target.closest("a,summary"))return;const card=e.target.closest("[data-id]");if(card)selectRestaurant(card.dataset.id)});
    $("cards").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("article.card")){const card=e.target.closest("[data-id]");if(card)selectRestaurant(card.dataset.id)}});
    $("searchInput").addEventListener("input",()=>applyFilters(true));$("pagination").addEventListener("click",event=>{const button=event.target.closest("[data-page]");if(!button||button.disabled)return;currentPage=Number(button.dataset.page)||1;render();$("sectionTitle").scrollIntoView({behavior:reducedMotion.matches?"auto":"smooth",block:"start"})});$("mapLocationBtn").addEventListener("click",()=>userLocation?focusOnLocation():requestLocation(true));$("mapResetBtn").addEventListener("click",fitMapToMarkers);$("placeSheet").addEventListener("click",event=>{if(event.target.closest("[data-sheet-close]"))closePlaceSheet()});$("locationHelp").addEventListener("click",event=>{if(event.target.closest("[data-location-close]"))$("locationHelp").close()});document.querySelectorAll(".nav-btn").forEach(x=>x.addEventListener("click",()=>{if(x.dataset.view==="map"){ownMap=false;$("mapScopeBtn").setAttribute("aria-pressed","false");$("mapScopeBtn").textContent="내 지도만 보기";}setView(x.dataset.view);}));
    $("openLogin").addEventListener("click",async()=>{const{data}=await authClient.auth.getSession();if(data.session){const{error}=await authClient.auth.signOut();if(error)toast("로그아웃하지 못했어요");else toast("로그아웃했어요");return}$("authMessage").textContent="";$("loginDialog").showModal()});
    $("accountNickname").addEventListener("click",()=>{if(currentProfile)openProfileEditor(currentProfile)});
    $("googleLogin").addEventListener("click",()=>startSocialLogin("google"));$("kakaoLogin").addEventListener("click",()=>startSocialLogin("kakao"));$("closeLogin").addEventListener("click",()=>$("loginDialog").close());
    $("profileForm").addEventListener("submit",saveMemberProfile);$("profileLogout").addEventListener("click",async()=>{const{error}=await authClient.auth.signOut();if(error)toast("로그아웃하지 못했어요");else toast("로그아웃했어요")});$("profileDialog").addEventListener("cancel",event=>{if(!currentProfile)event.preventDefault()});
    async function load(refresh=false){try{const r=await fetch(API+"?t="+Date.now());if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j.ok||!Array.isArray(j.restaurants))throw new Error("Invalid site data");restaurants=groupRestaurants(j.restaurants);dataReady=true;loadingError=false;updateDistances();applyFilters();if($("connectReelDialog").open)showPlaceMatches()}catch(error){console.error("Restaurant data load failed",error);if(!refresh&&!dataReady){loadingError=true;applyFilters()}}}
    window.addEventListener("resize",()=>{if(mapReady&&$("mapWrap").offsetWidth)map.relayout()});setView("map");initSocialAuth().then(()=>trackEngagement(null,"visit"));
    Promise.allSettled([loadKakaoMap(),load()]).then(()=>{
      window.dispatchEvent(new Event("reelsmap:startup-ready"));
    });
    setInterval(()=>load(true),300000);
  </script>
</body>
</html>

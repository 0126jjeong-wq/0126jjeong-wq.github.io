    async function load(refresh=false){try{const r=await fetch(API+"?t="+Date.now());if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j.ok||!Array.isArray(j.restaurants))throw new Error("Invalid site data");restaurants=groupRestaurants(j.restaurants);dataReady=true;loadingError=false;updateDistances();applyFilters();if($("connectReelDialog").open)showPlaceMatches()}catch(error){console.error("Restaurant data load failed",error);if(!refresh&&!dataReady){loadingError=true;applyFilters()}}}
    window.addEventListener("resize",()=>{if(mapReady&&$("mapWrap").offsetWidth)map.relayout()});setView("map");initSocialAuth().then(()=>trackEngagement(null,"visit"));
    // Reveal the already-rendered app shell as soon as its controls are wired.
    // Kakao tiles and restaurant data continue loading in the background.
    window.dispatchEvent(new Event("reelsmap:startup-ready"));
    Promise.allSettled([loadKakaoMap(),load()]).then(()=>{
      if(mapReady&&window.ReelsNative?.enabled){
        map.relayout();
        requestAnimationFrame(()=>requestAnimationFrame(()=>map.relayout()));
      }
    });
    setInterval(()=>load(true),300000);
  </script>
</body>
